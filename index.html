        // --- SISTEMA DE GERAÇÃO VETORIAL DO AVATAR (SVG DISSOCIADO) ---
        function generateAvatarSVG(config) {
            const cfg = config || defaultAvatar;
            let hairSVG = '';
            if (cfg.hair === 'short') {
                hairSVG = `<path d="M30 40 Q50 10 70 40 Q50 30 30 40" fill="${cfg.hairColor}"/>`;
            } else if (cfg.hair === 'long') {
                hairSVG = `<path d="M25 40 Q50 5 75 40 Q85 80 75 80 Q50 35 25 80 Q15 80 25 40" fill="${cfg.hairColor}"/>`;
            } else if (cfg.hair === 'undercut') {
                hairSVG = `<path d="M33 35 L50 15 L67 35 Z" fill="${cfg.hairColor}"/><circle cx="50" cy="22" r="6" fill="${cfg.hairColor}"/>`;
            }

            let accSVG = '';
            if (cfg.accessory === 'glasses') {
                accSVG = `
                    <rect x="33" y="44" width="13" height="9" rx="2" fill="none" stroke="#222" stroke-width="2.5"/>
                    <rect x="54" y="44" width="13" height="9" rx="2" fill="none" stroke="#222" stroke-width="2.5"/>
                    <line x1="46" y1="48" x2="54" y2="48" stroke="#222" stroke-width="2.5"/>
                `;
            } else if (cfg.accessory === 'hat') {
                accSVG = `<path d="M28 34 Q50 15 72 34 Z" fill="#ff4b4b"/><path d="M25 34 L75 30 L70 35 L28 35 Z" fill="#cc3333"/>`;
            }

            return `
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <circle cx="50" cy="50" r="48" fill="${cfg.bg}"/>
                    <path d="M20 95 Q50 65 80 95 Z" fill="${cfg.clothing}"/>
                    <circle cx="50" cy="50" r="23" fill="${cfg.skin}"/>
                    <circle cx="43" cy="47" r="2.5" fill="#333"/>
                    <circle cx="57" cy="47" r="2.5" fill="#333"/>
                    <path d="M44 57 Q50 63 56 57" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    ${hairSVG}
                    ${accSVG}
                </svg>
            `;
        }

        // --- SISTEMA DE AUDIO NATIVO ---
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);

            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.start(); osc.stop(ctx.currentTime + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(90, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const ut = new SpeechSynthesisUtterance(text);
            const course = userData.currentCourse || 'en';
            if (course === 'en') ut.lang = 'en-US';
            else if (course === 'es') ut.lang = 'es-ES';
            else if (course === 'fr') ut.lang = 'fr-FR';
            else if (course === 'ja') ut.lang = 'ja-JP';
            window.speechSynthesis.speak(ut);
        }

        function speakCurrentQuestion() {
            if (currentLessonData[currentStep]) speakText(currentLessonData[currentStep].q);
        }

                document.getElementById('main-screen').classList.add('hidden');
            }
        });

        // --- MANIPULAÇÃO E ATUALIZAÇÃO DOS DADOS ---
        function syncData() {
            db.ref('users/' + currentUser.uid).on('value', (snapshot) => {
                if (!snapshot.exists()) return;
                userData = snapshot.val();
                
                // Validação Inteligente da Ofensiva (Reseta se pulou mais de um dia completo)
                if (userData.lastLessonDate) {
                    const hoje = new Date().toDateString();
                    const ontem = new Date(Date.now() - 86400000).toDateString();
                    if (userData.lastLessonDate !== hoje && userData.lastLessonDate !== ontem) {
                        db.ref('users/' + currentUser.uid).update({ streak: 0 });
                    }
                }

                // Renderiza Elementos Estáticos
                document.getElementById('user-streak').innerText = userData.streak || 0;
                document.getElementById('user-lingots').innerText = userData.lingots || 50;
                document.getElementById('profile-name-input').value = userData.displayName || "Estudante";
                document.getElementById('profile-email').innerText = userData.email;
                document.getElementById('profile-xp').innerText = userData.xp || 0;
                document.getElementById('profile-level').innerText = Math.floor((userData.xp || 0) / 100) + 1;
                document.getElementById('course-selector').value = userData.currentCourse || "en";
                
                // Renderização Dinâmica de Avatares
                const currentAvatarHTML = generateAvatarSVG(userData.avatar);
                document.getElementById('profile-avatar-render').innerHTML = currentAvatarHTML;
                document.getElementById('nav-avatar-container').innerHTML = currentAvatarHTML;

                // Ativa a animação de fogo se o streak estiver quente
                if ((userData.streak || 0) > 0) {
                    document.getElementById('streak-icon').classList.add('animate-fire', 'inline-block');
                } else {
                    document.getElementById('streak-icon').classList.remove('animate-fire');
                }

                // Carrega os módulos sociais bilaterais
                loadIncomingRequests();
                loadSocialRanking();
            });
        }

        window.startLesson = function(skill) {
            const course = userData.currentCourse || 'en';
            currentLessonData = lessonsDB[course][skill]; 
            currentStep = 0; isAnswerChecked = false;
            document.getElementById('lesson-modal').classList.remove('hidden');
            renderStep();
        };

        window.closeLesson = function() { document.getElementById('lesson-modal').classList.add('hidden'); };

        function renderStep() {
            isAnswerChecked = false;
            document.getElementById('feedback-panel').classList.add('hidden');
            document.getElementById('lesson-submit').innerText = "Verificar";
            document.getElementById('lesson-submit').className = "w-full max-w-md mx-auto duo-btn-blue text-white font-extrabold py-4 px-6 rounded-2xl text-sm uppercase tracking-wider";
            document.getElementById('lesson-counter').innerText = `${currentStep + 1}/10`;
            document.getElementById('lesson-progress').style.width = `${(currentStep / 10) * 100}%`;

            if (currentStep >= 10) {
                // Tela Final de Lição Concluída Nativa com Animação
                document.getElementById('lesson-progress').style.width = '100%';
                document.getElementById('feedback-panel').className = "w-full max-w-md mx-auto rounded-2xl p-6 bg-green-100 text-green-700 text-center animate-bounce";
                document.getElementById('feedback-panel').innerHTML = `<h3 class="text-2xl font-extrabold mb-1">🔥 Ofensiva Suprema!</h3><p>Lição Concluída com Sucesso! +10 XP obtidos.</p>`;
                document.getElementById('feedback-panel').classList.remove('hidden');
                playSound('correct');

                document.getElementById('lesson-submit').innerText = "Fechar e Computar";
                document.getElementById('lesson-submit').onclick = function() {
                    const hoje = new Date().toDateString();
                    let novaOfensiva = userData.streak || 0;
                    if (userData.lastLessonDate !== hoje) { novaOfensiva++; }

                    // Atualiza Perfil
                    db.ref('users/' + currentUser.uid).update({
                        xp: (userData.xp || 0) + 10,
                        streak: novaOfensiva,
                        lastLessonDate: hoje
                    });

                    // Cria um evento público para os amigos reagirem
                    db.ref('public_feed').push({
                        uid: currentUser.uid,
                        userName: userData.displayName || "Estudante",
                        avatar: userData.avatar || defaultAvatar,
                        msg: `completou uma lição impecável e alcançou ${novaOfensiva} dias de Ofensiva! 🚀`,
                        timestamp: Date.now(),
                        likes: 0
                    });

                    closeLesson();
                    document.getElementById('lesson-submit').onclick = checkAnswer; // restaura trigger original
                };
                return;
            }

            const stepData = currentLessonData[currentStep];
            document.getElementById('lesson-question').innerText = stepData.q;
            speakText(stepData.q);

            const optionsContainer = document.getElementById('lesson-options');
            optionsContainer.innerHTML = '';
            stepData.options.forEach((opt, idx) => {
                optionsContainer.innerHTML += `<button onclick="selectOption(${idx}, '${opt}')" class="option-btn w-full duo-card text-left font-bold py-4 px-6 rounded-2xl text-sm border-2 border-[#e5e5e5] bg-white" data-index="${idx}">${opt}</button>`;
            });
            selectedOptionIndex = null;
        }

        window.selectOption = function(idx, txt) {
            if (isAnswerChecked) return;
            speakText(txt);
            document.querySelectorAll('.option-btn').forEach(b => { b.classList.remove('border-[#1cb0f6]', 'bg-[#ddf4ff]'); b.classList.add('border-[#e5e5e5]'); });
            document.querySelector(`[data-index="${idx}"]`).classList.add('border-[#1cb0f6]', 'bg-[#ddf4ff]');
            selectedOptionIndex = idx;
        };

        window.checkAnswer = function() {
            if (selectedOptionIndex === null) return;
            if (isAnswerChecked) { currentStep++; renderStep(); return; }

            const stepData = currentLessonData[currentStep];
            isAnswerChecked = true;
            const panel = document.getElementById('feedback-panel');

            if (selectedOptionIndex === stepData.correct) {
                playSound('correct');
                panel.className = "w-full max-w-md mx-auto rounded-2xl p-4 bg-green-100 text-green-700";
                document.getElementById('feedback-text').innerText = "✨ Resposta correta!";
                document.getElementById('lesson-submit').innerText = "Continuar";
                document.getElementById('lesson-submit').className = "w-full max-w-md mx-auto duo-btn-green text-white font-extrabold py-4 px-6 rounded-2xl text-sm uppercase tracking-wider";
            } else {
                playSound('wrong');
                panel.className = "w-full max-w-md mx-auto rounded-2xl p-4 bg-red-100 text-red-700";
                document.getElementById('feedback-text').innerText = `😢 Errado. Resposta correta: ${stepData.options[stepData.correct]}`;
                document.getElementById('lesson-submit').innerText = "Entendi";
            }
            panel.classList.remove('hidden');
        };

        // --- SISTEMA DE AMIGOS E SOLICITAÇÕES BILATERAIS REAIS ---
        window.sendFriendRequest = function() {
            const targetEmail = document.getElementById('friend-search-input').value.trim();
            const msgEl = document.getElementById('social-status-msg');
            if (!targetEmail) return;

            msgEl.innerText = "Processando busca...";
            db.ref('users').orderByChild('email').equalTo(targetEmail).once('value', (snap) => {
                if (snap.exists()) {
                    const targetUid = Object.keys(snap.val())[0];
                    if (targetUid === currentUser.uid) { msgEl.innerText = "Você não pode se convidar!"; return; }

                    // Envia solicitação para o nó de destino do amigo
                    db.ref(`users/${targetUid}/friend_requests/${currentUser.uid}`).set({
                        fromName: userData.displayName || "Um usuário",
                        fromEmail: userData.email
                    }).then(() => {
                        msgEl.innerText = "Solicitação enviada! Diga para ele aceitar nas notificações.";
                        document.getElementById('friend-search-input').value = "";
                    });
                } else {
                    msgEl.innerText = "E-mail não cadastrado no Firebase.";
                }
            });
        };

        function loadIncomingRequests() {
            const box = document.getElementById('notifications-box');
            const listContainer = document.getElementById('incoming-requests-list');
            const badge = document.getElementById('notif-badge');

            db.ref(`users/${currentUser.uid}/friend_requests`).on('value', (snap) => {
                listContainer.innerHTML = '';
                if (snap.exists()) {
                    const requests = snap.val();
                    const totalNotifs = Object.keys(requests).length;
                    
                    badge.innerText = totalNotifs;
                    badge.classList.remove('hidden');
                    box.classList.remove('hidden');

                    Object.keys(requests).forEach(senderUid => {
                        const req = requests[senderUid];
                        listContainer.innerHTML += `
                            <div class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-amber-200">
                                <div class="text-xs text-amber-900"><b class="text-sm">${req.fromName}</b> (${req.fromEmail}) quer ser seu amigo!</div>
                                <div class="flex gap-1">
                                    <button onclick="acceptFriend('${senderUid}')" class="bg-[#58cc02] text-white text-xs px-2.5 py-1 font-bold rounded-lg uppercase shadow-sm">Aceitar</button>
                                    <button onclick="rejectFriend('${senderUid}')" class="bg-gray-200 text-gray-600 text-xs px-2.5 py-1 font-bold rounded-lg uppercase">Recusar</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    badge.classList.add('hidden');
                    box.classList.add('hidden');
                }
            });
        }

        window.acceptFriend = function(senderUid) {
            // Vincula no nó de ambos para criar a amizade bilateral real
            db.ref(`users/${currentUser.uid}/friends/${senderUid}`).set(true);
            db.ref(`users/${senderUid}/friends/${currentUser.uid}`).set(true);
            // Deleta o pedido aceito
            db.ref(`users/${currentUser.uid}/friend_requests/${senderUid}`).remove();
        };

        window.rejectFriend = function(senderUid) {
            db.ref(`users/${currentUser.uid}/friend_requests/${senderUid}`).remove();
        };

        // --- RENDERIZADOR DO RANKING DA LIGA ---
        function loadSocialRanking() {
            let rankingData = [];
            // Inclui o próprio usuário
            rankingData.push({ uid: currentUser.uid, avatar: userData.avatar, name: (userData.displayName || "Você"), xp: (userData.xp || 0), isMe: true });

            if (userData.friends) {
                const promises = Object.keys(userData.friends).map(fUid => {
                    return db.ref('users/' + fUid).once('value').then(snap => {
                        if (snap.exists()) {
                            const f = snap.val();
                            rankingData.push({ uid: fUid, avatar: f.avatar, name: f.displayName || "Estudante", xp: f.xp || 0, isMe: false });
                        }
                    });
                });
                Promise.all(promises).then(() => renderSocialRankingHTML(rankingData));
            } else {
                renderSocialRankingHTML(rankingData);
            }
        }

        function renderSocialRankingHTML(list) {
            list.sort((a, b) => b.xp - a.xp);
            const container = document.getElementById('social-ranking-list');
            container.innerHTML = '';

            list.forEach((u, i) => {
                const posColor = i === 0 ? 'text-amber-500 text-xl' : i === 1 ? 'text-slate-400 text-lg' : 'text-amber-800';
                container.innerHTML += `
                    <div class="duo-card rounded-2xl p-4 flex items-center justify-between ${u.isMe ? 'bg-blue-50 border-blue-300' : 'bg-white'}">
                        <div class="flex items-center gap-4">
                            <span class="font-extrabold w-6 text-center ${posColor}">${i + 1}</span>
                            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-gray-200">${generateAvatarSVG(u.avatar)}</div>
                            <h4 class="font-extrabold text-sm">${u.name} ${u.isMe ? '(Você)' : ''}</h4>
                        </div>
                        <div class="font-extrabold text-sm text-orange-500">⚡ ${u.xp} XP</div>
                    </div>
                `;
            });
            loadSocialFeed();
        }

        // --- FEED INTERATIVO COM REAÇÕES E COMENTÁRIOS VIA STRING ---
        function loadSocialFeed() {
            db.ref('public_feed').limitToLast(10).on('value', (snap) => {
                const container = document.getElementById('social-feed-container');
                container.innerHTML = '';
                if (!snap.exists()) {
                    container.innerHTML = `<p class="text-gray-400 text-center font-bold text-xs py-4">Nenhuma atividade recente na liga.</p>`;
                    return;
                }

                const feeds = snap.val();
                // Renderiza em ordem inversa (mais recente no topo)
                Object.keys(feeds).reverse().forEach(feedId => {
                    const f = feeds[feedId];
                    
                    // Render de Comentários salvos no Firebase
                    let commentsHTML = '';
                    if (f.comments) {
                        Object.keys(f.comments).forEach(cId => {
                            const c = f.comments[cId];
                            commentsHTML += `<div class="bg-gray-50 p-2 rounded-xl text-xs mt-1 border border-gray-100"><b>${c.author}:</b> ${c.text}</div>`;
                        });
                    }

                    container.innerHTML += `
                        <div class="duo-card rounded-2xl p-4 bg-white border border-gray-200 space-y-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-200">${generateAvatarSVG(f.avatar)}</div>
                                <div class="text-xs text-gray-600"><b class="text-sm text-gray-800">${f.userName}</b> ${f.msg}</div>
                            </div>
                            <div class="flex gap-2 items-center text-xs">
                                <button onclick="likeFeedItem('${feedId}')" class="bg-red-50 hover:bg-red-100 text-red-500 px-3 py-1.5 rounded-xl font-bold">❤️ Curtir (${f.likes || 0})</button>
                                <input id="reply-input-${feedId}" type="text" placeholder="Responda ou parabenize..." class="flex-1 bg-gray-100 rounded-xl px-3 py-1.5 border border-transparent focus:outline-none focus:bg-white focus:border-[#1cb0f6] font-bold">
                                <button onclick="commentFeedItem('${feedId}')" class="bg-[#1cb0f6] text-white px-3 py-1.5 rounded-xl font-bold">Enviar</button>
                            </div>
                            <div class="space-y-1 pl-2 border-l-2 border-gray-200">${commentsHTML}</div>
                        </div>
                    `;
                });
            });
        }

        window.likeFeedItem = function(feedId) {
            db.ref(`public_feed/${feedId}/likes`).transaction((currentLikes) => (currentLikes || 0) + 1);
        };

        window.commentFeedItem = function(feedId) {
            const input = document.getElementById(`reply-input-${feedId}`);
            const commentText = input.value.trim();
            if (!commentText) return;

            db.ref(`public_feed/${feedId}/comments`).push({
                author: userData.displayName || "Estudante",
                text: commentText
            }).then(() => { input.value = ''; });
        };

        // Gerenciador de Abas Global
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        };
    </script>
</body>
</html>
