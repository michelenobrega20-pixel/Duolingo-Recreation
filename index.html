<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duolingo Meta - Multi-Disciplinar</title>
    
    <!-- Google Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase Legacy SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Nunito', sans-serif; user-select: none; }
        .duo-btn-green { background-color: #58cc02; border-bottom: 4px solid #46a302; }
        .duo-btn-green:active { border-bottom-width: 0px; margin-top: 4px; }
        .duo-btn-blue { background-color: #1cb0f6; border-bottom: 4px solid #1899d6; }
        .duo-btn-blue:active { border-bottom-width: 0px; margin-top: 4px; }
        .duo-card { border: 2px solid #e5e5e5; border-bottom-width: 4px; }
        .duo-card:active { border-bottom-width: 2px; }
        
        @keyframes pulse-fire {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #f97316); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 12px #ef4444); }
        }
        .animate-fire { animation: pulse-fire 1.5s infinite ease-in-out; }
    </style>
</head>
<body class="bg-white text-[#3c3c3c] antialiased">

    <!-- Tela 1: Autenticação -->
    <div id="auth-screen" class="flex flex-col items-center justify-center min-h-screen px-4">
        <div class="text-center max-w-sm w-full">
            <div class="text-6xl mb-4 animate-bounce">🦉</div>
            <h1 class="text-3xl font-extrabold text-[#58cc02] tracking-wide mb-8">duolingo<span class="text-xs text-blue-400 block font-normal">Plus Ultra</span></h1>
            <div class="space-y-3 mb-6">
                <input id="email-input" type="email" placeholder="E-mail" class="w-full px-4 py-3 bg-[#f7f7f7] border-2 border-[#e5e5e5] rounded-2xl focus:outline-none focus:border-[#1cb0f6] font-bold text-sm">
                <input id="password-input" type="password" placeholder="Senha" class="w-full px-4 py-3 bg-[#f7f7f7] border-2 border-[#e5e5e5] rounded-2xl focus:outline-none focus:border-[#1cb0f6] font-bold text-sm">
            </div>
            <button id="btn-login-email" class="w-full duo-btn-green text-white font-extrabold py-3 px-6 rounded-2xl text-sm uppercase tracking-wider mb-3 transition-all">Entrar</button>
            <button id="btn-register-email" class="w-full border-2 border-[#e5e5e5] hover:bg-[#f7f7f7] font-extrabold py-3 px-6 rounded-2xl text-sm uppercase tracking-wider mb-6 transition-all">Criar Conta</button>
            <div class="relative flex py-4 items-center"><div class="flex-grow border-t border-[#e5e5e5]"></div><span class="flex-shrink mx-4 text-[#afafaf] font-bold text-xs uppercase">Ou</span><div class="flex-grow border-t border-[#e5e5e5]"></div></div>
            <button id="btn-login-google" class="w-full border-2 border-[#e5e5e5] hover:bg-[#f7f7f7] font-extrabold py-3 px-6 rounded-2xl text-sm uppercase tracking-wider flex items-center justify-center gap-2">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google"> Entrar com Google
            </button>
        </div>
    </div>

    <!-- Tela 2: Dashboard -->
    <div id="main-screen" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- Sidebar Navigation -->
        <nav class="w-full md:w-64 border-r-2 border-[#e5e5e5] p-4 flex flex-row md:flex-col justify-between md:justify-start gap-2 fixed bottom-0 md:relative bg-white z-50">
            <div class="hidden md:block text-2xl font-extrabold text-[#58cc02] tracking-wide p-4 mb-6">duolingo</div>
            <button onclick="switchTab('learn')" class="flex items-center gap-4 p-3 w-full hover:bg-[#f7f7f7] rounded-xl font-extrabold text-[#777]">
                <span class="text-xl">🏡</span> <span class="hidden md:inline text-sm uppercase tracking-wider">Aprender</span>
            </button>
            <button onclick="switchTab('profile')" class="flex items-center gap-4 p-3 w-full hover:bg-[#f7f7f7] rounded-xl font-extrabold text-[#777]">
                <div id="nav-avatar-container" class="w-6 h-6 rounded-full overflow-hidden"></div>
                <span class="hidden md:inline text-sm uppercase tracking-wider">Perfil</span>
            </button>
            <button onclick="switchTab('social')" class="flex items-center gap-4 p-3 w-full hover:bg-[#f7f7f7] rounded-xl font-extrabold text-[#777] relative">
                <span class="text-xl">👥</span> <span class="hidden md:inline text-sm uppercase tracking-wider">Social</span>
                <span id="notif-badge" class="hidden absolute top-2 left-7 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
            </button>
            <button id="btn-logout" class="hidden md:flex items-center gap-4 p-3 w-full hover:bg-red-50 rounded-xl font-extrabold text-red-500 mt-auto">
                <span>🚪</span> <span class="text-sm uppercase tracking-wider">Sair</span>
            </button>
        </nav>

        <!-- Main Workspace -->
        <main class="flex-1 p-6 mb-20 md:mb-0 max-w-2xl mx-auto w-full">
            <!-- Barra de Status Superior -->
            <div class="flex items-center justify-end gap-6 border-b-2 border-[#e5e5e5] pb-4 mb-6 font-extrabold text-sm">
                <div id="streak-container" class="flex items-center gap-2 text-orange-500">
                    <span id="streak-icon" class="text-xl">🔥</span> <span id="user-streak">0</span> dias
                </div>
                <div class="flex items-center gap-2 text-[#ffc800]"><span>💎</span> <span id="user-lingots">50</span></div>
            </div>

            <!-- TAB: APRENDER -->
            <div id="tab-learn" class="tab-content">
                <div class="mb-6">
                    <label class="block text-xs font-extrabold text-[#afafaf] uppercase tracking-wider mb-2">O que deseja estudar hoje?</label>
                    <select id="course-selector" class="bg-white border-2 border-[#e5e5e5] rounded-xl px-4 py-2 font-bold focus:outline-none w-full sm:w-auto">
                        <option value="en">🇺🇸 Idiomas: Inglês</option>
                        <option value="ko">🇰🇷 Idiomas: Coreano</option>
                        <option value="matematica">🔢 Exatas: Matemática</option>
                        <option value="xadrez">👑 Estratégia: Xadrez</option>
                    </select>
                </div>

                <!-- Árvore Dinâmica de Fases -->
                <div id="dynamic-skills-tree" class="flex flex-col items-center gap-6 py-4"></div>

                <!-- Modal de Estudo Adaptativo -->
                <div id="lesson-modal" class="hidden fixed inset-0 bg-white z-50 p-6 flex flex-col justify-between">
                    <div class="flex justify-between items-center max-w-md mx-auto w-full">
                        <button onclick="closeLesson()" class="text-2xl font-bold text-[#afafaf]">✕</button>
                        <div class="w-full mx-4 bg-[#e5e5e5] h-4 rounded-full overflow-hidden">
                            <div id="lesson-progress" class="bg-[#58cc02] h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <span id="lesson-counter" class="font-bold text-sm text-[#afafaf]">1/10</span>
                    </div>

                    <div id="lesson-main-content" class="text-center max-w-md mx-auto my-auto w-full space-y-4">
                        <div id="activity-type-badge" class="inline-block px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs font-extrabold uppercase tracking-wide"></div>
                        <h2 id="lesson-question" class="text-2xl font-extrabold">Questão</h2>
                        <div id="lesson-options" class="grid grid-cols-1 gap-3 pt-4"></div>
                    </div>

                    <div id="feedback-panel" class="w-full max-w-md mx-auto rounded-2xl p-4 mb-4 hidden font-extrabold text-sm">
                        <p id="feedback-text" class="text-lg"></p>
                    </div>
                    <button id="lesson-submit" onclick="checkAnswer()" class="w-full max-w-md mx-auto duo-btn-blue text-white font-extrabold py-4 px-6 rounded-2xl text-sm uppercase tracking-wider">Verificar</button>
                </div>
            </div>

            <!-- TAB: PERFIL & AVATAR BUILDER -->
            <div id="tab-profile" class="tab-content hidden">
                <div class="duo-card rounded-2xl p-6 mb-6 flex flex-col sm:flex-row items-center gap-6 bg-white relative">
                    <div class="flex flex-col items-center gap-2">
                        <div id="profile-avatar-render" class="w-32 h-32 rounded-full border-4 border-[#e5e5e5] shadow-inner overflow-hidden bg-gray-100"></div>
                        <button onclick="openAvatarBuilder()" class="text-xs bg-[#1cb0f6] text-white font-extrabold px-3 py-1.5 rounded-xl uppercase tracking-wider shadow-[0_3px_0_#1899d6] active:translate-y-[2px] active:shadow-none">Editar Boneco</button>
                    </div>
                    <div class="flex-1 w-full text-center sm:text-left">
                        <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                            <input id="profile-name-input" type="text" disabled class="text-2xl font-extrabold bg-transparent border-b-2 border-transparent py-1 w-full text-center sm:text-left focus:outline-none focus:border-[#1cb0f6]">
                            <button id="btn-edit-profile" onclick="toggleEditProfile()" class="text-xs font-bold text-[#1cb0f6] underline cursor-pointer">Alterar Nome</button>
                        </div>
                        <p id="profile-email" class="text-[#afafaf] font-bold text-sm mt-1"></p>
                    </div>
                </div>

                <!-- Construtor Modular de Avatar -->
                <div id="avatar-builder-panel" class="hidden duo-card rounded-2xl p-4 mb-6 bg-[#f7f7f7] border-2 border-[#1cb0f6]">
                    <h3 class="font-extrabold text-lg mb-4 text-center text-[#1cb0f6]">🎨 Customizar Seu Personagem</h3>
                    <div class="grid grid-cols-2 gap-3 text-xs font-bold">
                        <div><label class="block mb-1 text-gray-500">Cor de Pele</label><select id="av-skin" class="w-full p-2 border-2 border-gray-200 rounded-xl bg-white" onchange="previewAvatar()"><option value="#ffdbac">Clara</option><option value="#f1c27d">Morena</option><option value="#8d5524">Negra</option></select></div>
                        <div><label class="block mb-1 text-gray-500">Cabelo</label><select id="av-hair" class="w-full p-2 border-2 border-gray-200 rounded-xl bg-white" onchange="previewAvatar()"><option value="short">Curto</option><option value="long">Comprido</option><option value="undercut">Arrepiado</option><option value="none">Careca</option></select></div>
                        <div><label class="block mb-1 text-gray-500">Cor Cabelo</label><select id="av-hair-color" class="w-full p-2 border-2 border-gray-200 rounded-xl bg-white" onchange="previewAvatar()"><option value="#4a3728">Castanho</option><option value="#222222">Preto</option><option value="#e5c158">Loiro</option></select></div>
                        <div><label class="block mb-1 text-gray-500">Roupas</label><select id="av-clothing" class="w-full p-2 border-2 border-gray-200 rounded-xl bg-white" onchange="previewAvatar()"><option value="#58cc02">Verde</option><option value="#1cb0f6">Azul</option><option value="#ff4b4b">Vermelho</option></select></div>
                        <div><label class="block mb-1 text-gray-500">Acessórios</label><select id="av-accessory" class="w-full p-2 border-2 border-gray-200 rounded-xl bg-white" onchange="previewAvatar()"><option value="none">Nenhum</option><option value="glasses">Óculos</option><option value="hat">Boné</option></select></div>
                        <div><label class="block mb-1 text-gray-500">Fundo</label><select id="av-bg" class="w-full p-2 border-2 border-gray-200 rounded-xl bg-white" onchange="previewAvatar()"><option value="#ddf4ff">Céu</option><option value="#e8fcda">Verde</option><option value="#fff1cb">Ouro</option></select></div>
                    </div>
                    <div class="flex gap-2 mt-4"><button onclick="saveAvatar()" class="flex-1 bg-[#58cc02] text-white font-extrabold py-2 rounded-xl text-sm uppercase tracking-wide shadow-[0_3px_0_#46a302]">Salvar</button><button onclick="closeAvatarBuilder()" class="bg-gray-300 text-gray-700 font-extrabold px-4 py-2 rounded-xl text-sm">Voltar</button></div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="duo-card rounded-2xl p-4 text-center"><span class="text-2xl">⚡</span><h3 class="font-extrabold text-xl mt-1" id="profile-xp">0</h3><p class="text-[#afafaf] text-xs font-bold uppercase">Total de XP</p></div>
                    <div class="duo-card rounded-2xl p-4 text-center"><span class="text-2xl">👑</span><h3 class="font-extrabold text-xl mt-1" id="profile-level">1</h3><p class="text-[#afafaf] text-xs font-bold uppercase">Nível</p></div>
                </div>
            </div>

            <!-- TAB: SOCIAL (AMIGOS E SOLICITAÇÕES) -->
            <div id="tab-social" class="tab-content hidden space-y-6">
                <div class="duo-card rounded-2xl p-4 bg-white">
                    <h3 class="font-extrabold text-base mb-2">🤝 Adicionar Novo Amigo</h3>
                    <div class="flex gap-2">
                        <input id="friend-search-input" type="text" placeholder="Insira o e-mail exato do seu irmão" class="flex-1 px-4 py-2 bg-[#f7f7f7] border-2 border-[#e5e5e5] rounded-xl focus:outline-none focus:border-[#1cb0f6] font-bold text-sm">
                        <button onclick="sendFriendRequest()" class="duo-btn-blue text-white px-4 rounded-xl font-extrabold text-sm uppercase tracking-wider">Enviar Convite</button>
                    </div>
                    <p id="social-status-msg" class="text-xs font-bold mt-2 text-gray-400"></p>
                </div>

                <div id="notifications-box" class="duo-card rounded-2xl p-4 bg-amber-50 hidden border-2 border-amber-300">
                    <h3 class="font-extrabold text-amber-800 text-sm mb-2">🔔 Convites de Amizade Recebidos</h3>
                    <div id="incoming-requests-list" class="space-y-2"></div>
                </div>

                <div>
                    <h3 class="font-extrabold text-lg mb-3">🏆 Tabela da Liga de Amigos</h3>
                    <div id="social-ranking-list" class="space-y-3"></div>
                </div>

                <div class="border-t-2 border-[#e5e5e5] pt-4">
                    <h3 class="font-extrabold text-lg mb-3">💬 Feed de Conquistas da Galera</h3>
                    <div id="social-feed-container" class="space-y-4"></div>
                </div>
            </div>
        </main>
    </div>

        function sanitizeEmail(email) {
            return email.toLowerCase().replace(/\./g, ',');
        }

        function generateAvatarSVG(config) {
            const cfg = config || defaultAvatar;
            let hairSVG = '';
            if (cfg.hair === 'short') hairSVG = `<path d="M30 40 Q50 10 70 40 Q50 30 30 40" fill="${cfg.hairColor}"/>`;
            else if (cfg.hair === 'long') hairSVG = `<path d="M25 40 Q50 5 75 40 Q85 80 75 80 Q50 35 25 80 Q15 80 25 40" fill="${cfg.hairColor}"/>`;

            let accSVG = '';

            else if (cfg.accessory === 'hat') accSVG = `<path d="M28 34 Q50 15 72 34 Z" fill="#ff4b4b"/><path d="M25 34 L75 30 L70 35 L28 35 Z" fill="#cc3333"/>`;

            return `
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <circle cx="50" cy="50" r="48" fill="${cfg.bg}"/>
                    <path d="M20 95 Q50 65 80 95 Z" fill="${cfg.clothing}"/>
                    <circle cx="50" cy="50" r="23" fill="${cfg.skin}"/>
                    <circle cx="43" cy="47" r="2.5" fill="#333"/>
                    <circle cx="57" cy="47" r="2.5" fill="#333"/>
                    <path d="M44 57 Q50 63 56 57" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    ${hairSVG} ${accSVG}
                </svg>
            `;
        }

        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            if (type === 'correct') {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, ctx.currentTime);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            }
        }

        // --- AUTH & ATALHOS DE BUSCA DE EMAIL ---
        document.getElementById('btn-login-email').addEventListener('click', () => {
            auth.signInWithEmailAndPassword(document.getElementById('email-input').value, document.getElementById('password-input').value).catch(err => alert(err.message));
        });

        document.getElementById('btn-register-email').addEventListener('click', () => {
            const email = document.getElementById('email-input').value;
            auth.createUserWithEmailAndPassword(email, document.getElementById('password-input').value).then((cred) => {
                const uid = cred.user.uid;
                db.ref('users/' + uid).set({ email: email, displayName: email.split('@')[0], xp: 0, streak: 0, lastLessonDate: "", lingots: 50, avatar: defaultAvatar, currentCourse: "en" });
                db.ref('emails/' + sanitizeEmail(email)).set(uid);
            }).catch(err => alert(err.message));
        });

        document.getElementById('btn-login-google').addEventListener('click', () => {
            auth.signInWithPopup(googleProvider).then((cred) => {
                const uid = cred.user.uid;
                db.ref('users/' + uid).once('value').then((snapshot) => {
                    if (!snapshot.exists()) {
                        db.ref('users/' + uid).set({ email: cred.user.email, displayName: cred.user.displayName, xp: 0, streak: 0, lastLessonDate: "", lingots: 50, avatar: defaultAvatar, currentCourse: "en" });
                        db.ref('emails/' + sanitizeEmail(cred.user.email)).set(uid);
                    }
                });
            }).catch(err => alert(err.message));
        });

        document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

        auth.onAuthStateChanged((user) => {
            if (user) { currentUser = user; document.getElementById('auth-screen').classList.add('hidden'); document.getElementById('main-screen').classList.remove('hidden'); syncData(); }
            else { currentUser = null; document.getElementById('auth-screen').classList.remove('hidden'); document.getElementById('main-screen').classList.add('hidden'); }
        });

        function syncData() {
            db.ref('users/' + currentUser.uid).on('value', (snapshot) => {
                if (!snapshot.exists()) return;
                userData = snapshot.val();
                
                document.getElementById('user-streak').innerText = userData.streak || 0;
                document.getElementById('user-lingots').innerText = userData.lingots || 50;
                document.getElementById('profile-name-input').value = userData.displayName || "Estudante";
                document.getElementById('profile-email').innerText = userData.email;
                document.getElementById('profile-xp').innerText = userData.xp || 0;
                document.getElementById('profile-level').innerText = Math.floor((userData.xp || 0) / 100) + 1;
                document.getElementById('course-selector').value = userData.currentCourse || "en";
                
                const currentAvatarHTML = generateAvatarSVG(userData.avatar);
                document.getElementById('profile-avatar-render').innerHTML = currentAvatarHTML;
                document.getElementById('nav-avatar-container').innerHTML = currentAvatarHTML;

                if ((userData.streak || 0) > 0) document.getElementById('streak-icon').classList.add('animate-fire', 'inline-block');
                else document.getElementById('streak-icon').classList.remove('animate-fire');

                renderTree(userData.currentCourse || "en");
                loadIncomingRequests();
                loadSocialRanking();
            });
        }

        // --- RENDERIZADOR DA ÁRVORE DE SKILLS DINÂMICA ---
        function renderTree(courseKey) {
            const container = document.getElementById('dynamic-skills-tree');
            container.innerHTML = '';
            const skills = treeMeta[courseKey] || [];
            
            skills.forEach((sk, idx) => {
                const alignClass = idx % 2 === 0 ? '' : 'translate-x-12';
                container.innerHTML += `
                    <div class="text-center ${alignClass}">
                        <button onclick="startLesson('${sk.id}')" style="background-color: ${sk.color}" class="w-16 h-16 text-white rounded-full flex items-center justify-center text-2xl font-bold shadow-lg transform hover:scale-105 transition-all">${sk.icon}</button>
                        <p class="font-extrabold mt-2 text-xs">${sk.name}</p>
                    </div>
                `;
            });
        }

        document.getElementById('course-selector').addEventListener('change', (e) => {
            db.ref('users/' + currentUser.uid).update({ currentCourse: e.target.value });
        });

        // --- ENGINE DE LIÇÕES COM TIPOS DE ATIVIDADES ---
        window.startLesson = function(skill) {
            const course = userData.currentCourse || 'en';
            currentLessonData = lessonsDB[course][skill]; 
            currentStep = 0; isAnswerChecked = false;
            document.getElementById('lesson-modal').classList.remove('hidden');
            renderStep();
        };

        window.closeLesson = function() { document.getElementById('lesson-modal').classList.add('hidden'); };

        function renderStep() {
            isAnswerChecked = false;
            document.getElementById('feedback-panel').classList.add('hidden');
            document.getElementById('lesson-submit').innerText = "Verificar";
            document.getElementById('lesson-counter').innerText = `${currentStep + 1}/10`;
            document.getElementById('lesson-progress').style.width = `${(currentStep / 10) * 100}%`;

            if (currentStep >= 10) {
                document.getElementById('lesson-progress').style.width = '100%';
                document.getElementById('feedback-panel').className = "w-full max-w-md mx-auto rounded-2xl p-6 bg-green-100 text-green-700 text-center animate-bounce";
                document.getElementById('feedback-panel').innerHTML = `<h3 class="text-2xl font-extrabold mb-1">🔥 Lição Concluída!</h3><p>Parabéns! Você ganhou +10 XP.</p>`;
                document.getElementById('feedback-panel').classList.remove('hidden');
                playSound('correct');

                document.getElementById('lesson-submit').innerText = "Fechar e Computar";
                document.getElementById('lesson-submit').onclick = function() {
                    const hoje = new Date().toDateString();
                    let novaOfensiva = userData.streak || 0;
                    if (userData.lastLessonDate !== hoje) { novaOfensiva++; }

                    db.ref('users/' + currentUser.uid).update({ xp: (userData.xp || 0) + 10, streak: novaOfensiva, lastLessonDate: hoje });
                    db.ref('public_feed').push({ uid: currentUser.uid, userName: userData.displayName || "Estudante", avatar: userData.avatar || defaultAvatar, msg: `completou a trilha de estudo e alcançou ${novaOfensiva} dias de Ofensiva! 🚀`, timestamp: Date.now(), likes: 0 });

                    closeLesson();
                    document.getElementById('lesson-submit').onclick = checkAnswer;
                };
                return;
            }

            const stepData = currentLessonData[currentStep];
            document.getElementById('lesson-question').innerText = stepData.q;
            
            // Define o Badge do Tipo de Atividade
            const badge = document.getElementById('activity-type-badge');
            if (stepData.type === 'v_f') { badge.innerText = "🤔 Verdadeiro ou Falso"; badge.className = "inline-block px-3 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-extrabold uppercase"; }
            else if (stepData.type === 'lacuna') { badge.innerText = "🧩 Complete a Lacuna"; badge.className = "inline-block px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-extrabold uppercase"; }
            else { badge.innerText = "📝 Múltipla Escolha"; badge.className = "inline-block px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-extrabold uppercase"; }

            const optionsContainer = document.getElementById('lesson-options');
            optionsContainer.innerHTML = '';
            stepData.options.forEach((opt, idx) => {
                optionsContainer.innerHTML += `<button onclick="selectOption(${idx})" class="option-btn w-full duo-card text-left font-bold py-4 px-6 rounded-2xl text-sm border-2 border-[#e5e5e5] bg-white" data-index="${idx}">${opt}</button>`;
            });
            selectedOptionIndex = null;
        }

        window.selectOption = function(idx) {
            if (isAnswerChecked) return;
            document.querySelectorAll('.option-btn').forEach(b => { b.classList.remove('border-[#1cb0f6]', 'bg-[#ddf4ff]'); b.classList.add('border-[#e5e5e5]'); });
            document.querySelector(`[data-index="${idx}"]`).classList.add('border-[#1cb0f6]', 'bg-[#ddf4ff]');
            selectedOptionIndex = idx;
        };

        window.checkAnswer = function() {
            if (selectedOptionIndex === null) return;
            if (isAnswerChecked) { currentStep++; renderStep(); return; }

            const stepData = currentLessonData[currentStep];
            isAnswerChecked = true;
            const panel = document.getElementById('feedback-panel');

            if (selectedOptionIndex === stepData.correct) {
                playSound('correct');
                panel.className = "w-full max-w-md mx-auto rounded-2xl p-4 bg-green-100 text-green-700";
                document.getElementById('feedback-text').innerText = "✨ Resposta correta!";
                document.getElementById('lesson-submit').innerText = "Continuar";
            } else {
                playSound('wrong');
                panel.className = "w-full max-w-md mx-auto rounded-2xl p-4 bg-red-100 text-red-700";
                document.getElementById('feedback-text').innerText = `😢 Errado. Resposta certa: ${stepData.options[stepData.correct]}`;
                document.getElementById('lesson-submit').innerText = "Entendi";
            }
            panel.classList.remove('hidden');
        };

        // --- SISTEMA CORRIGIDO DE ADICIONAR AMIGO (MÉTODO INSTANTÂNEO POR ATALHO) ---
        window.sendFriendRequest = function() {
            const targetEmail = document.getElementById('friend-search-input').value.trim();
            const msgEl = document.getElementById('social-status-msg');
            if (!targetEmail) return;

            msgEl.innerText = "Buscando usuário...";
            const lookUpKey = sanitizeEmail(targetEmail);

            db.ref('emails/' + lookUpKey).once('value', (snap) => {
                if (snap.exists()) {
                    const targetUid = snap.val();
                    if (targetUid === currentUser.uid) { msgEl.innerText = "Você não pode se convidar!"; return; }

                    db.ref(`users/${targetUid}/friend_requests/${currentUser.uid}`).set({
                        fromName: userData.displayName || "Um usuário",
                        fromEmail: userData.email
                    }).then(() => {
                        msgEl.innerText = "Boa! Convite enviado com sucesso. Avise seu irmão!";
                        document.getElementById('friend-search-input').value = "";
                    });
                } else {
                    msgEl.innerText = "E-mail não encontrado. Certifique-se de que ele já criou a conta.";
                }
            }).catch(() => { msgEl.innerText = "Erro na busca."; });
        };

        function loadIncomingRequests() {
            const box = document.getElementById('notifications-box');
            const listContainer = document.getElementById('incoming-requests-list');
            const badge = document.getElementById('notif-badge');

            db.ref(`users/${currentUser.uid}/friend_requests`).on('value', (snap) => {
                listContainer.innerHTML = '';
                if (snap.exists()) {
                    const requests = snap.val();
                    badge.innerText = Object.keys(requests).length;
                    badge.classList.remove('hidden'); box.classList.remove('hidden');

                    Object.keys(requests).forEach(senderUid => {
                        const req = requests[senderUid];
                        listContainer.innerHTML += `
                            <div class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-amber-200">
                                <div class="text-xs text-amber-900"><b class="text-sm">${req.fromName}</b> quer ser seu amigo!</div>
                                <div class="flex gap-1">
                                    <button onclick="acceptFriend('${senderUid}')" class="bg-[#58cc02] text-white text-xs px-2.5 py-1 font-bold rounded-lg uppercase">Aceitar</button>
                                    <button onclick="rejectFriend('${senderUid}')" class="bg-gray-200 text-gray-600 text-xs px-2.5 py-1 font-bold rounded-lg">Recusar</button>
                                </div>
                            </div>
                        `;
                    });
                } else { badge.classList.add('hidden'); box.classList.add('hidden'); }
            });
        }

        window.acceptFriend = function(senderUid) {
            db.ref(`users/${currentUser.uid}/friends/${senderUid}`).set(true);
            db.ref(`users/${senderUid}/friends/${currentUser.uid}`).set(true);
            db.ref(`users/${currentUser.uid}/friend_requests/${senderUid}`).remove();
        };

        window.rejectFriend = function(senderUid) { db.ref(`users/${currentUser.uid}/friend_requests/${senderUid}`).remove(); };

        function loadSocialRanking() {
            let rankingData = [];
            rankingData.push({ uid: currentUser.uid, avatar: userData.avatar, name: (userData.displayName || "Você"), xp: (userData.xp || 0), isMe: true });

            if (userData.friends) {
                const promises = Object.keys(userData.friends).map(fUid => {
                    return db.ref('users/' + fUid).once('value').then(snap => {
                        if (snap.exists()) {
                            const f = snap.val();
                            rankingData.push({ uid: fUid, avatar: f.avatar, name: f.displayName || "Estudante", xp: f.xp || 0, isMe: false });
                        }
                    });
                });
                Promise.all(promises).then(() => renderSocialRankingHTML(rankingData));
            } else { renderSocialRankingHTML(rankingData); }
        }

        function renderSocialRankingHTML(list) {
            list.sort((a, b) => b.xp - a.xp);
            const container = document.getElementById('social-ranking-list');
            container.innerHTML = '';
            list.forEach((u, i) => {
                container.innerHTML += `
                    <div class="duo-card rounded-2xl p-4 flex items-center justify-between ${u.isMe ? 'bg-blue-50 border-blue-300' : 'bg-white'}">
                        <div class="flex items-center gap-4">
                            <span class="font-extrabold w-6 text-center">${i + 1}</span>
                            <div class="w-12 h-12 rounded-full overflow-hidden border-2 border-gray-200">${generateAvatarSVG(u.avatar)}</div>
                            <h4 class="font-extrabold text-sm">${u.name} ${u.isMe ? '(Você)' : ''}</h4>
                        </div>
                        <div class="font-extrabold text-sm text-orange-500">⚡ ${u.xp} XP</div>
                    </div>
                `;
            });
            loadSocialFeed();
        }

        function loadSocialFeed() {
            db.ref('public_feed').limitToLast(10).on('value', (snap) => {
                const container = document.getElementById('social-feed-container');
                container.innerHTML = '';
                if (!snap.exists()) return;

                const feeds = snap.val();
                Object.keys(feeds).reverse().forEach(feedId => {
                    const f = feeds[feedId];
                    let commentsHTML = '';
                    if (f.comments) {
                        Object.keys(f.comments).forEach(cId => {
                            const c = f.comments[cId];
                            commentsHTML += `<div class="bg-gray-50 p-2 rounded-xl text-xs mt-1"><b>${c.author}:</b> ${c.text}</div>`;
                        });
                    }

                    container.innerHTML += `
                        <div class="duo-card rounded-2xl p-4 bg-white border border-gray-200 space-y-3">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full overflow-hidden border border-gray-200">${generateAvatarSVG(f.avatar)}</div>
                                <div class="text-xs text-gray-600"><b class="text-sm text-gray-800">${f.userName}</b> ${f.msg}</div>
                            </div>
                            <div class="flex gap-2 items-center text-xs">
                                <button onclick="likeFeedItem('${feedId}')" class="bg-red-50 text-red-500 px-3 py-1.5 rounded-xl font-bold">❤️ (${f.likes || 0})</button>
                                <input id="reply-input-${feedId}" type="text" placeholder="Responda para parabenizar..." class="flex-1 bg-gray-100 rounded-xl px-3 py-1.5 focus:outline-none focus:bg-white border text-xs font-bold">
                                <button onclick="commentFeedItem('${feedId}')" class="bg-[#1cb0f6] text-white px-3 py-1.5 rounded-xl font-bold">Enviar</button>
                            </div>
                            <div class="space-y-1 pl-2 border-l-2 border-gray-200">${commentsHTML}</div>
                        </div>
                    `;
                });
            });
        }

        window.likeFeedItem = function(feedId) { db.ref(`public_feed/${feedId}/likes`).transaction(c => (c || 0) + 1); };
        window.commentFeedItem = function(feedId) {
            const input = document.getElementById(`reply-input-${feedId}`);
            if (!input.value.trim()) return;
            db.ref(`public_feed/${feedId}/comments`).push({ author: userData.displayName || "Estudante", text: input.value.trim() }).then(() => input.value = '');
        };

        window.toggleEditProfile = function() {
            const input = document.getElementById('profile-name-input');
            const btn = document.getElementById('btn-edit-profile');
            if (input.disabled) { input.disabled = false; input.focus(); btn.innerText = "Salvar"; }
            else { input.disabled = true; btn.innerText = "Alterar Nome"; db.ref('users/' + currentUser.uid).update({ displayName: input.value }); }
        };

        window.openAvatarBuilder = function() { document.getElementById('avatar-builder-panel').classList.remove('hidden'); };
        window.closeAvatarBuilder = function() { document.getElementById('avatar-builder-panel').classList.add('hidden'); };
        window.previewAvatar = function() {
            const p = { skin: document.getElementById('av-skin').value, hair: document.getElementById('av-hair').value, hairColor: document.getElementById('av-hair-color').value, clothing: document.getElementById('av-clothing').value, accessory: document.getElementById('av-accessory').value, bg: document.getElementById('av-bg').value };
            document.getElementById('profile-avatar-render').innerHTML = generateAvatarSVG(p);
        };
        window.saveAvatar = function() {
            const p = { skin: document.getElementById('av-skin').value, hair: document.getElementById('av-hair').value, hairColor: document.getElementById('av-hair-color').value, clothing: document.getElementById('av-clothing').value, accessory: document.getElementById('av-accessory').value, bg: document.getElementById('av-bg').value };
            db.ref('users/' + currentUser.uid + '/avatar').set(p).then(() => closeAvatarBuilder());
        };

        window.switchTab = function(t) { document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden')); document.getElementById(`tab-${t}`).classList.remove('hidden'); };
    </script>
</body>
</html>
